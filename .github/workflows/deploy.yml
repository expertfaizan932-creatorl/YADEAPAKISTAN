name: Deploy to yadea.biztrack.uk

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Write SMTP secrets
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          # SMTP_PASS drives every transactional email (form acknowledgements,
          # dealership registrations, CRM notifications). Refuse to deploy
          # without it so the mail path can never silently break.
          if [ -z "$SMTP_PASS" ]; then
            echo "::error::SMTP_PASS secret is empty — refusing to deploy without a mail password."
            exit 1
          fi
          printf "<?php\ndefine('SMTP_PASS', '%s');\n" "$SMTP_PASS" > api/mail_secrets.php

      - name: Deploy to 81.17.101.93 (yadea.biztrack.uk)
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # SSH_PRIVATE_KEY holds the PEM/DSA key. It may be stored raw or
          # base64-encoded, so write it raw first and fall back to decoding.
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          if ! ssh-keygen -l -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -l -f ~/.ssh/deploy_key

          ssh-keyscan -H 81.17.101.93 >> ~/.ssh/known_hosts 2>/dev/null

          # Step 1: Create MySQL user if needed (MariaDB root uses unix_socket auth)
          ssh -i ~/.ssh/deploy_key root@81.17.101.93 bash << 'SERVERFIX'
          set -e
          # Try creating user (ignore error if exists)
          mysql -u root -e "
            CREATE USER IF NOT EXISTS 'evee'@'localhost' IDENTIFIED BY 'EveeCrm2026!';
            GRANT ALL PRIVILEGES ON evee_crm.* TO 'evee'@'localhost';
            FLUSH PRIVILEGES;
          " 2>/dev/null || echo "User creation skipped (may already exist)"
          # Widen staff_users.user_type if it is an ENUM that doesn't include
          # 'Dealer' — the public dealer registration form inserts that value
          # and MariaDB truncates/errors when it isn't in the allowed set.
          mysql -u evee -p'EveeCrm2026!' evee_crm -e "
            ALTER TABLE staff_users MODIFY COLUMN user_type VARCHAR(50) NOT NULL DEFAULT 'User';
          " 2>/dev/null || echo "user_type widen skipped (may already be VARCHAR or no permission)"
          # Verify the user works
          mysql -u evee -p'EveeCrm2026!' evee_crm -e "SELECT COUNT(*) AS ok FROM contacts" && echo "DB_USER_OK" || echo "DB_USER_FAIL"
          SERVERFIX

          # Step 2: Package files
          rm -rf /tmp/site && mkdir -p /tmp/site
          cp -r dist/* /tmp/site/
          cp -r api /tmp/site/api
          tar -czf /tmp/site.tar.gz -C /tmp/site .

          # Step 3: Upload (mail config ships fresh from the repo so the
          # current SMTP credentials are always deployed — nothing stale
          # is preserved from previous builds)
          scp -i ~/.ssh/deploy_key /tmp/site.tar.gz root@81.17.101.93:/tmp/site.tar.gz

          # Step 4: Extract, fix DB creds in config.php, restart PHP-FPM
          ssh -i ~/.ssh/deploy_key root@81.17.101.93 bash << 'SERVERDEPLOY'
          set -e
          rm -rf /var/www/yadea-pakistan/dist
          mkdir -p /var/www/yadea-pakistan/dist
          tar -xzf /tmp/site.tar.gz -C /var/www/yadea-pakistan/dist/
          rm -rf /var/www/yadea-pakistan/api
          mv /var/www/yadea-pakistan/dist/api /var/www/yadea-pakistan/api

          # Fix DB credentials in config.php (replace XAMPP defaults with production values)
          sed -i "s/define('DB_USER',.*$/define('DB_USER', getenv('DB_USER') ?: 'evee');/" /var/www/yadea-pakistan/api/config.php
          sed -i "s/define('DB_PASS',.*$/define('DB_PASS', getenv('DB_PASS') ?: 'EveeCrm2026!');/" /var/www/yadea-pakistan/api/config.php

          chown -R www-data:www-data /var/www/yadea-pakistan
          rm -f /tmp/site.tar.gz
          systemctl reload php8.3-fpm
          echo DEPLOY_OK
          SERVERDEPLOY

          # Step 5: surface the mail debug log so delivery status (ok=1/0,
          # FAIL/EXCEPTION lines) is visible right in the deploy output.
          ssh -i ~/.ssh/deploy_key root@81.17.101.93 "tail -n 40 /var/www/yadea-pakistan/mail-debug.log 2>/dev/null || echo MAIL_LOG_EMPTY"

          # Step 6: Ensure nginx serves the built SPA assets under /Yadea/ too.
          # The SPA is built with base './' and served at the site root by nginx
          # (root /var/www/yadea-pakistan/dist), but the same build must also work
          # when the page is opened at https://yadea.biztrack.uk/Yadea/ (the URL the
          # CRM has shipped under). At that path a relative reference ./assets/*.js
          # resolves to /Yadea/assets/* — nginx only routes /Yadea/api/ to PHP, so
          # those asset requests fall through to the SPA catch-all and come back as
          # index.html instead of the real JS/CSS, and the app never boots.
          # Add a plain prefix location that aliases /Yadea/ onto the dist folder;
          # the regex locations for /Yadea/api/index.php and /Yadea/api/*.php are
          # still evaluated first (nginx checks regex before non-^~ prefixes), so the
          # API keeps working unchanged.
          ssh -i ~/.ssh/deploy_key root@81.17.101.93 bash << 'NGINXFIX'
          set -e
          CFG=/etc/nginx/sites-enabled/biztrack-yadea
          cp "$CFG" /tmp/biztrack-yadea.bak

          # Turn on compression. Without this nginx ships the 1.7 MB JS bundle and
          # every multi-megabyte JSON list response uncompressed, which is what made
          # the CRM feel slow on anything but a fast connection. gzip takes the
          # bundle to roughly a quarter of its size and the JSON payloads to about a
          # tenth. The block is inserted inside the server{} block, before
          # "location /", and is marked so re-running the deploy is a no-op.
          if grep -q "# yadea compression (managed by deploy)" "$CFG"; then
              echo GZIP_ALREADY_PATCHED
          else
              cat > /tmp/yadea-gzip.conf << 'BLOCK'
          # yadea compression (managed by deploy)
          gzip on;
          gzip_vary on;
          gzip_proxied any;
          gzip_comp_level 5;
          gzip_min_length 512;
          gzip_types
              text/plain
              text/css
              text/xml
              text/javascript
              application/javascript
              application/x-javascript
              application/json
              application/manifest+json
              application/xml
              image/svg+xml;

          BLOCK
              python3 - "$CFG" /tmp/yadea-gzip.conf << 'PY'
          import sys
          path, snip = sys.argv[1], sys.argv[2]
          with open(snip, encoding='utf-8') as f:
              block = f.read()
          with open(path, encoding='utf-8') as f:
              lines = f.readlines()
          for i, line in enumerate(lines):
              if line.strip().startswith('location / {'):
                  lines[i:i] = [block]
                  break
          else:
              raise SystemExit('no "location /" block found to anchor the gzip config')
          with open(path, 'w', encoding='utf-8') as f:
              f.writelines(lines)
          PY
              rm -f /tmp/yadea-gzip.conf
              echo GZIP_PATCHED
          fi

          if grep -q "# yadea static assets (managed by deploy)" "$CFG"; then
              echo NGINX_ALREADY_PATCHED
          else
              # writes the snippet, then python inserts it before "location /"
              cat > /tmp/yadea-location.conf << 'BLOCK'
          # yadea static assets (managed by deploy)
          location /Yadea/ {
              alias /var/www/yadea-pakistan/dist/;
              index index.html;
              try_files $uri $uri/ /index.html;
          }

          BLOCK
              python3 - "$CFG" /tmp/yadea-location.conf << 'PY'
          import sys
          path, snip = sys.argv[1], sys.argv[2]
          with open(snip, encoding='utf-8') as f:
              block = f.read()
          with open(path, encoding='utf-8') as f:
              lines = f.readlines()
          for i, line in enumerate(lines):
              if line.strip().startswith('location / {'):
                  lines[i:i] = [block]
                  break
          with open(path, 'w', encoding='utf-8') as f:
              f.writelines(lines)
          PY
              rm -f /tmp/yadea-location.conf
              echo NGINX_PATCHED
          fi

          nginx -t && systemctl reload nginx || { cp /tmp/biztrack-yadea.bak "$CFG"; nginx -t && systemctl reload nginx; rm -f /tmp/biztrack-yadea.bak; echo NGINX_REVERTED; exit 1; }
          rm -f /tmp/biztrack-yadea.bak
          echo NGINX_OK
          NGINXFIX
